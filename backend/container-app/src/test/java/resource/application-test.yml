# src/test/resources/application-test.yml
spring:
  application:
    name: education-service-test

  # Database configuration (overridden by Testcontainers)
  datasource:
    url: jdbc:postgresql://localhost:5432/education_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Disable unnecessary auto-configurations for tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Logging
logging:
  level:
    root: INFO
    com.braintrust: DEBUG
    org.springframework.test: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Test-specific properties
ai:
  model-default-type: MOCK_MODEL

# Disable circuit breakers in tests
resilience4j:
  circuitbreaker:
    enabled: false