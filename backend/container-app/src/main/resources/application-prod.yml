spring:
  config:
    activate:
      on-profile: prod

  application:
    name: braintrust-platform-api

  threads:
    virtual:
      enabled: true

  task:
    execution:
      type: virtual

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=prefer
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
      show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

# ==========================================
# 🆕 GOOGLE GEMINI AI CONFIGURATION
# ==========================================
google:
  ai:
    # Uses env var GOOGLE_AI_API_KEY, defaults to empty if not set
    api-key: ${GOOGLE_AI_API_KEY:AIzaSyDg7nKIoxf7EtCTWA9dqUESHgtHUCgpCdM}
    # Model for text extraction (PDF processing)
    extraction-model: ${GOOGLE_AI_EXTRACTION_MODEL:gemini-2.5-flash}
    # Model for AI detection analysis
    detection-model: ${GOOGLE_AI_DETECTION_MODEL:gemini-2.5-flash}
    # Model for general queries (optional)
    model: ${GOOGLE_AI_MODEL:gemini-2.5-flash}

# ==========================================
# 🆕 AI SERVICE CONFIGURATION
# ==========================================
ai:
  # Provider selection for different services
  provider: ${AI_PROVIDER:GoogleGeminiAIProvider} # Options: GoogleGeminiAIProvider, MockPythonAIDetectionProvider, MockTextExtractionProvider

  # Text extraction provider (for PDF processing)
  text-extraction:
    provider: ${TEXT_EXTRACTION_PROVIDER:MockTextExtractionProvider} # Options: GoogleGeminiAIProvider, MockTextExtractionProvider

  # Default model type for AI detection
  model-default-type: ${AI_MODEL_DEFAULT_TYPE:ENSEMBLE}

  # AI detection service settings
  detection:
    enabled: ${AI_DETECTION_ENABLED:true}
    timeout-ms: ${AI_DETECTION_TIMEOUT:30000}
    rate-limit-per-minute: ${AI_DETECTION_RATE_LIMIT:60}

  # Text extraction service settings
  extraction:
    enabled: ${AI_EXTRACTION_ENABLED:true}
    timeout-ms: ${AI_EXTRACTION_TIMEOUT:30000}
    max-file-size-mb: ${AI_EXTRACTION_MAX_FILE_SIZE:10}
    rate-limit-per-minute: ${AI_EXTRACTION_RATE_LIMIT:30}

# ==========================================
# 🆕 SUBMISSION AI ANALYSIS CONFIGURATION
# ==========================================
submission:
  ai-analysis:
    enabled: ${SUBMISSION_AI_ANALYSIS_ENABLED:true}
    min-text-length: ${AI_ANALYSIS_MIN_TEXT_LENGTH:50}
    max-text-length: ${AI_ANALYSIS_MAX_TEXT_LENGTH:100000}
    # Only analyze DIGITAL format submissions
    allowed-formats: ${AI_ANALYSIS_ALLOWED_FORMATS:DIGITAL}

  # Rate limiting for submission processing
  storage:
    max-concurrent: ${SUBMISSION_STORAGE_MAX_CONCURRENT:20}
  extraction:
    max-concurrent: ${SUBMISSION_EXTRACTION_MAX_CONCURRENT:10}
  analysis:
    max-concurrent: ${SUBMISSION_ANALYSIS_MAX_CONCURRENT:50}

# ==========================================
# 🆕 MOCK PROVIDER CONFIGURATION (for testing)
# ==========================================
mock:
  # Text extraction mock settings
  text-extraction:
    simulate-delay: ${MOCK_EXTRACTION_SIMULATE_DELAY:true}
    delay-min-ms: ${MOCK_EXTRACTION_DELAY_MIN:800}
    delay-max-ms: ${MOCK_EXTRACTION_DELAY_MAX:2500}
    simulate-ocr-errors: ${MOCK_EXTRACTION_SIMULATE_OCR_ERRORS:true}
    ocr-error-rate: ${MOCK_EXTRACTION_OCR_ERROR_RATE:0.05}
    availability-rate: ${MOCK_EXTRACTION_AVAILABILITY_RATE:0.95}

  # AI detection mock settings
  ai-detection:
    simulate-delay: ${MOCK_DETECTION_SIMULATE_DELAY:true}
    delay-min-ms: ${MOCK_DETECTION_DELAY_MIN:500}
    delay-max-ms: ${MOCK_DETECTION_DELAY_MAX:1500}
    availability-rate: ${MOCK_DETECTION_AVAILABILITY_RATE:0.90}

# ==========================================
# 🔄 EXISTING LEGACY AI SERVICES (Python Modules)
# ==========================================
ai-python:
  analyze:
    url: ${AI_PYTHON_ANALYZE_URL:http://localhost:8001/analyze}
  extract:
    url: ${AI_PYTHON_EXTRACT_URL:http://localhost:8000/extract}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 10000
      min-spare: 10
    accept-count: 1000
    max-connections: 10000
    connection-timeout: 60000
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE_PATH:classpath:keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:braintrust}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
  issuer: ${JWT_ISSUER:https://api.braintrust.com}

security:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:60}
  ip-whitelist:
    enabled: ${IP_WHITELIST_ENABLED:false}
    admin-ips: ${ADMIN_IPS:}

document:
  storage:
    strategy: ${DOCUMENT_STORAGE_STRATEGY:parallel}
    local:
      base-path: ${DOCUMENT_STORAGE_LOCAL_BASE_PATH:./storage/documents}
    s3:
      bucket-name: ${DOCUMENT_STORAGE_S3_BUCKET_NAME:braintrust-submissions}
      region: ${DOCUMENT_STORAGE_S3_REGION:us-east-1}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    doc-expansion: none
    display-request-duration: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.braintrust: ${LOG_LEVEL:INFO}
    com.braintrust.aidetectition: ${AI_LOG_LEVEL:DEBUG}
    com.braintrust.education: ${EDUCATION_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.springframework.web: ${WEB_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,virtualthreads
      base-path: /actuator
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: ${PROMETHEUS_ENABLED:true}
    enable:
      http: true
      jvm: true
      system: true
      process: true
      logback: true
      executor: true

# ==========================================
# 🏗️ SERVICE SPECIFIC CONFIGURATIONS
# ==========================================
braintrust:
  services:
    ai-detection:
      base-path: /api/ai-analysis
      health-check-interval: 30000
      retry-attempts: 3
      retry-delay-ms: 1000
    submission:
      base-path: /api/submissions
      max-attachments-per-submission: 5
      allowed-mime-types: application/pdf,image/jpeg,image/png,text/plain
    assignment:
      base-path: /api/assignments
    course:
      base-path: /api/courses