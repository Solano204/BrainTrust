spring:
  config:
    activate:
      on-profile: prod

  application:
    name: braintrust-platform-api

  threads:
    virtual:
      enabled: true

  task:
    execution:
      type: virtual

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=prefer
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
      show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 10000
      min-spare: 10
    accept-count: 1000
    max-connections: 10000
    connection-timeout: 60000
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE_PATH:classpath:keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:braintrust}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
  issuer: ${JWT_ISSUER:https://api.braintrust.com}

security:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:60}
  ip-whitelist:
    enabled: ${IP_WHITELIST_ENABLED:false}
    admin-ips: ${ADMIN_IPS:}

ai:
  python:
    analyze:
      url: ${AI_PYTHON_ANALYZE_URL:http://localhost:8001/analyze}
    extract:
      url: ${AI_PYTHON_EXTRACT_URL:http://localhost:8000/extract}
  model-default-type: ${AI_MODEL_DEFAULT_TYPE:ENSEMBLE}

document:
  storage:
    strategy: ${DOCUMENT_STORAGE_STRATEGY:parallel}
    local:
      base-path: ${DOCUMENT_STORAGE_LOCAL_BASE_PATH:./storage/documents}
    s3:
      bucket-name: ${DOCUMENT_STORAGE_S3_BUCKET_NAME:braintrust-submissions}
      region: ${DOCUMENT_STORAGE_S3_REGION:us-east-1}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    doc-expansion: none
    display-request-duration: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.braintrust: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,virtualthreads
      base-path: /actuator
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: ${PROMETHEUS_ENABLED:true}