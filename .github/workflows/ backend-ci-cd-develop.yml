name: Backend CI/CD - Develop

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-*.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-test-and-push:
    name: Build, Test & Push Backend Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: backend

    steps:
      # ============================================
      # CHECKOUT CODE
      # ============================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ============================================
      # SETUP JAVA 25 (UPDATED)
      # ============================================
      - name: ☕ Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      # ============================================
      # BUILD ALL MODULES SKIPPING TESTS (UPDATED)
      # ============================================
      - name: 🔨 Build All Modules (Skip Tests)
        run: |
          ./mvnw clean install -B -DskipTests=true
          echo "✅ All modules built successfully (tests skipped)"

      # ============================================
      # PACKAGE APPLICATION (SKIP TESTS)
      # ============================================
      - name: 📦 Build Application Package
        run: ./mvnw package -DskipTests -B

      # ============================================
      # SETUP DOCKER BUILDX
      # ============================================
      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================
      # LOGIN TO GITHUB CONTAINER REGISTRY
      # ============================================
      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ============================================
      # EXTRACT METADATA FOR DOCKER
      # ============================================
      - name: 🏷️ Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop-latest
            type=sha,prefix=develop-,format=short

      # ============================================
      # BUILD AND PUSH DOCKER IMAGE
      # ============================================
      - name: 🚀 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================
      # SUMMARY
      # ============================================
      - name: ✅ Deployment Summary
        run: |
          echo "## 🚀 Backend Develop - Build & Push Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Docker Images Published:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Pull Image:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop-latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY