name: Backend CI - Feature Branches

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-*.yml'

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # ============================================
      # CHECKOUT CODE
      # ============================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ============================================
      # SETUP JAVA 25 (UPDATED)
      # ============================================
      - name: ☕ Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      # ============================================
      # INSTALL ALL MODULES (SKIP TESTS - UPDATED)
      # ============================================
      - name: 🔨 Install All Modules
        run: ./mvnw clean install -DskipTests -B

      # ============================================
      # SKIP TESTS MESSAGE (UPDATED)
      # ============================================
      - name: ℹ️ Skip Tests Notice
        run: echo "🧪 Tests skipped - test folders deleted for troubleshooting"

      # ============================================
      # PACKAGE APPLICATION
      # ============================================
      - name: 📦 Package Application
        run: ./mvnw package -DskipTests -B

      # ============================================
      # UPLOAD ARTIFACTS
      # ============================================
      - name: 📤 Upload JAR Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: braintrust-backend-jar
          path: backend/container-app/target/*.jar
          retention-days: 5

      # ============================================
      # SUMMARY
      # ============================================
      - name: ✅ Build Summary
        if: always()
        run: |
          echo "## 🎯 Backend Feature Branch CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Note:** Tests skipped - test folders deleted" >> $GITHUB_STEP_SUMMARY