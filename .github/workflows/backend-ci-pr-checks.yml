name: Backend PR - Validation

on:
  pull_request:
    branches:
      - develop
      - main
      - master
      - 'release/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-*.yml'

jobs:
  validation:
    name: Validate Backend PR
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # ============================================
      # CHECKOUT CODE
      # ============================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================
      # SETUP JAVA 25 (UPDATED)
      # ============================================
      - name: ☕ Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      # ============================================
      # BUILD ALL MODULES (SKIP TESTS - UPDATED)
      # ============================================
      - name: 🔨 Build All Modules (Skip Tests)
        run: ./mvnw clean install -DskipTests -B

      # ============================================
      # CHECK FOR MERGE CONFLICTS
      # ============================================
      - name: 🔍 Check for Merge Conflicts
        working-directory: .
        run: |
          if git grep -l "<<<<<<< HEAD" -- 'backend/**/*.java' 'backend/**/*.xml' 'backend/**/*.yml' 'backend/**/*.yaml'; then
            echo "❌ Merge conflicts detected in backend!"
            exit 1
          else
            echo "✅ No merge conflicts found"
          fi

      # ============================================
      # SUMMARY
      # ============================================
      - name: ✅ PR Validation Summary
        if: always()
        run: |
          echo "## 🔍 Backend PR Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **From:** ${{ github.head_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **To:** ${{ github.base_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Note:** Tests skipped - test folders deleted" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ All backend checks passed! Ready to merge." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some backend checks failed. Please review." >> $GITHUB_STEP_SUMMARY
          fi